# What the API, worker and web console need when they run outside Docker, for debugging.
# See "Develop" in the README. Stop the full stack first: both use the same ports.
name: pitchwise-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pitchwise
      POSTGRES_PASSWORD: pitchwise
      POSTGRES_DB: pitchwise
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitchwise"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"

  mediamtx:
    image: docker.io/bluenviron/mediamtx:1.21.3
    # The worker on the host has to be able to delete the segments this writes.
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    ports:
      - "1935:1935"
      - "8890:8890/udp"
      # The API on the host polls this to see which streams are live.
      - "127.0.0.1:9997:9997"
      # The broadcast service on the host reads signals here. Never publish this beyond the machine.
      - "127.0.0.1:8554:8554"
      # The operator's previews.
      - "127.0.0.1:8889:8889"
      - "127.0.0.1:8189:8189/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MTX_WEBRTCADDITIONALHOSTS: "127.0.0.1"
      # MediaMTX asks the API on the host who may publish.
      MTX_AUTHHTTPADDRESS: "http://host.docker.internal:8000/internal/mediamtx/auth/devsecret"
      MTX_HLSCDNSECRET: "devsecret"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro,z
      - ./.dev-storage/recordings:/recordings:z

  nginx:
    image: nginx:1.27
    ports:
      - "${EDGE_PORT:-8080}:80"
    environment:
      HLS_SIGNING_SECRET: "devsecret"
      MEDIAMTX_CDN_SECRET: "devsecret"
      NGINX_ENVSUBST_FILTER: "HLS_SIGNING_SECRET|MEDIAMTX_CDN_SECRET"
    volumes:
      # Tracked in git, so Docker doesn't create it as root and block the API on the host.
      - ./.dev-storage/hls:/srv/hls:ro,z
      - ./.dev-storage/vod:/srv/vod:ro,z
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro,z
    depends_on:
      - mediamtx

volumes:
  pgdata:
