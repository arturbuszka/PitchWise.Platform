services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pitchwise
      POSTGRES_PASSWORD: pitchwise
      POSTGRES_DB: pitchwise
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitchwise"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7

  api:
    build:
      context: .
      dockerfile: api-dotnet/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_CONNECTION: "Host=postgres;Port=5432;Database=pitchwise;Username=pitchwise;Password=pitchwise"
      REDIS_URL: "redis:6379"
      STORAGE_DIR: "/app/storage"
      # The web console uses this key. Set your own, along with the secrets below, for anything but local use.
      BOOTSTRAP_API_KEY: "${DEMO_API_KEY:-demo-key}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      # Signed-URL minting; must match the nginx edge secret.
      HLS_BASE_URL: "${PUBLIC_EDGE_URL:-http://localhost:${EDGE_PORT:-8080}}"
      HLS_SIGNING_SECRET: "${HLS_SIGNING_SECRET:-devsecret}"
      HLS_LINK_TTL_SECONDS: "3600"
      # What encoders are told to publish to.
      RTMP_INGEST_URL: "${PUBLIC_RTMP_URL:-rtmp://localhost:1935}"
      SRT_INGEST_URL: "${PUBLIC_SRT_URL:-srt://localhost:8890}"
      # Where an operator's browser gets its low-delay previews.
      WEBRTC_BASE_URL: "${PUBLIC_WEBRTC_URL:-http://localhost:8889}"
      # Where the public match pages live.
      WEB_ORIGIN: "${PUBLIC_WEB_URL:-http://localhost:3000}"
      MEDIAMTX_API_URL: "http://mediamtx:9997"
      MEDIAMTX_AUTH_SECRET: "${MEDIAMTX_AUTH_SECRET:-devsecret}"
      MEDIAMTX_READ_SECRET: "${MEDIAMTX_READ_SECRET:-devsecret}"
      # No default on purpose: a key that is in this repo protects nothing. Outputs can't be set up without it.
      OUTPUT_ENCRYPTION_KEY: "${OUTPUT_ENCRYPTION_KEY:-}"
    volumes:
      - ./storage:/app/storage:z
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # Renders highlight reels and joins recordings with ffmpeg.
  worker:
    build:
      context: .
      dockerfile: worker-dotnet/Dockerfile
    environment:
      DATABASE_CONNECTION: "Host=postgres;Port=5432;Database=pitchwise;Username=pitchwise;Password=pitchwise"
      REDIS_URL: "redis://redis:6379"
      STORAGE_DIR: "/app/storage"
    volumes:
      - ./storage:/app/storage:z
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      # the API applies the migrations the worker depends on
      api:
        condition: service_healthy

  # Runs each match's switcher, and sends matches on to YouTube and Twitch. Its own service, so restarting the
  # worker doesn't cut a broadcast, and the only one that needs to reach destinations.
  broadcast:
    build:
      context: .
      dockerfile: broadcast-dotnet/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_CONNECTION: "Host=postgres;Port=5432;Database=pitchwise;Username=pitchwise;Password=pitchwise"
      MEDIAMTX_API_URL: "http://mediamtx:9997"
      MEDIAMTX_RTSP_URL: "rtsp://mediamtx:8554"
      MEDIAMTX_RTMP_URL: "rtmp://mediamtx:1935"
      MEDIAMTX_READ_SECRET: "${MEDIAMTX_READ_SECRET:-devsecret}"
      OUTPUT_ENCRYPTION_KEY: "${OUTPUT_ENCRYPTION_KEY:-}"
      # Only for trying this against a local server.
      OUTPUTS_ALLOW_PRIVATE_TARGETS: "${OUTPUTS_ALLOW_PRIVATE_TARGETS:-false}"
    depends_on:
      # the API applies the migrations this depends on
      api:
        condition: service_healthy

  # A local stand-in for YouTube or Twitch, only started with --profile test-destination.
  test-destination:
    image: docker.io/bluenviron/mediamtx:1.21.3
    profiles: [test-destination]
    volumes:
      - ./mediamtx/test-destination.yml:/mediamtx.yml:ro,z

  # Live ingest: takes RTMP and SRT from encoders and packages it as HLS for the edge.
  mediamtx:
    image: docker.io/bluenviron/mediamtx:1.21.3
    ports:
      - "1935:1935"
      - "8890:8890/udp"
      # The operator's previews. WebRTC needs the signalling port and the media port both.
      - "8889:8889"
      - "8189:8189/udp"
    environment:
      # The address browsers can send media back and forth with.
      MTX_WEBRTCADDITIONALHOSTS: "${PUBLIC_WEBRTC_HOST:-127.0.0.1}"
      MTX_AUTHHTTPADDRESS: "http://api:8000/internal/mediamtx/auth/${MEDIAMTX_AUTH_SECRET:-devsecret}"
      MTX_HLSCDNSECRET: "${MEDIAMTX_CDN_SECRET:-devsecret}"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro,z
      - ./storage/recordings:/recordings:z
    depends_on:
      api:
        condition: service_healthy

  # CDN-style edge: validates signed URLs and caches, so the API never serves stream bytes.
  nginx:
    image: nginx:1.27
    ports:
      - "${EDGE_PORT:-8080}:80"
    environment:
      HLS_SIGNING_SECRET: "${HLS_SIGNING_SECRET:-devsecret}"
      MEDIAMTX_CDN_SECRET: "${MEDIAMTX_CDN_SECRET:-devsecret}"
      # Only substitute our secrets; leave nginx runtime vars ($uri, $arg_md5, …) intact.
      NGINX_ENVSUBST_FILTER: "HLS_SIGNING_SECRET|MEDIAMTX_CDN_SECRET"
    volumes:
      - ./storage/hls:/srv/hls:ro,z
      - ./storage/vod:/srv/vod:ro,z
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro,z
    depends_on:
      - worker
      - mediamtx

  web:
    build:
      context: web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # The browser calls relative /api/*. The Next server forwards those to the API and adds the key.
      API_INTERNAL_URL: http://api:8000
      WEB_API_KEY: "${DEMO_API_KEY:-demo-key}"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
