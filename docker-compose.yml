services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pitchwise
      POSTGRES_PASSWORD: pitchwise
      POSTGRES_DB: pitchwise
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitchwise"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7

  api:
    build:
      context: .
      dockerfile: api-dotnet/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_CONNECTION: "Host=postgres;Port=5432;Database=pitchwise;Username=pitchwise;Password=pitchwise"
      REDIS_URL: "redis:6379"
      STORAGE_DIR: "/app/storage"
      # The web console uses this key. Set your own, along with the secrets below, for anything but local use.
      BOOTSTRAP_API_KEY: "${DEMO_API_KEY:-demo-key}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      # Signed-URL minting; must match the nginx edge secret.
      HLS_BASE_URL: "${PUBLIC_EDGE_URL:-http://localhost:8080}"
      HLS_SIGNING_SECRET: "${HLS_SIGNING_SECRET:-devsecret}"
      HLS_LINK_TTL_SECONDS: "3600"
      # What encoders are told to publish to.
      RTMP_INGEST_URL: "${PUBLIC_RTMP_URL:-rtmp://localhost:1935}"
      MEDIAMTX_API_URL: "http://mediamtx:9997"
      MEDIAMTX_AUTH_SECRET: "${MEDIAMTX_AUTH_SECRET:-devsecret}"
    volumes:
      - ./storage:/app/storage:z
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # Renders highlight reels with ffmpeg.
  worker:
    build:
      context: .
      dockerfile: worker-dotnet/Dockerfile
    environment:
      DATABASE_CONNECTION: "Host=postgres;Port=5432;Database=pitchwise;Username=pitchwise;Password=pitchwise"
      REDIS_URL: "redis://redis:6379"
      STORAGE_DIR: "/app/storage"
    volumes:
      - ./storage:/app/storage:z
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      # the API applies the migrations the worker depends on
      api:
        condition: service_healthy

  # Live ingest: takes RTMP from encoders and packages it as HLS for the edge.
  mediamtx:
    image: docker.io/bluenviron/mediamtx:1.21.3
    ports:
      - "1935:1935"
    environment:
      MTX_AUTHHTTPADDRESS: "http://api:8000/internal/mediamtx/auth/${MEDIAMTX_AUTH_SECRET:-devsecret}"
      MTX_HLSCDNSECRET: "${MEDIAMTX_CDN_SECRET:-devsecret}"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro,z
    depends_on:
      api:
        condition: service_healthy

  # CDN-style edge: validates signed URLs and caches, so the API never serves stream bytes.
  nginx:
    image: nginx:1.27
    ports:
      - "8080:80"
    environment:
      HLS_SIGNING_SECRET: "${HLS_SIGNING_SECRET:-devsecret}"
      MEDIAMTX_CDN_SECRET: "${MEDIAMTX_CDN_SECRET:-devsecret}"
      # Only substitute our secrets; leave nginx runtime vars ($uri, $arg_md5, …) intact.
      NGINX_ENVSUBST_FILTER: "HLS_SIGNING_SECRET|MEDIAMTX_CDN_SECRET"
    volumes:
      - ./storage/hls:/srv/hls:ro,z
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro,z
    depends_on:
      - worker
      - mediamtx

  web:
    build:
      context: web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # The browser calls relative /api/*. The Next server forwards those to the API and adds the key.
      API_INTERNAL_URL: http://api:8000
      WEB_API_KEY: "${DEMO_API_KEY:-demo-key}"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
