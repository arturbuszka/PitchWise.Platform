# RTMP or SRT in, HLS, RTSP and recordings out. Only publishing and the API call below are open to the outside:
# the HLS port is reached through the nginx edge, and the RTSP port and control API only from inside the
# deployment. Who may do what over which protocol is decided by MediaMtxAuthController.
logLevel: info

authMethod: http
# The address, with its secret, comes from MTX_AUTHHTTPADDRESS in docker-compose.yml.
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

api: yes
apiAddress: :9997

rtmp: yes
rtmpAddress: :1935

# Copes with poor links better than RTMP, as it retransmits lost packets over UDP.
srt: yes
srtAddress: :8890

hls: yes
hlsAddress: :8888
hlsVariant: mpegts
# Package as soon as the encoder connects, so the first viewer does not wait for a muxer to start.
hlsAlwaysRemux: yes
hlsSegmentCount: 7
hlsSegmentDuration: 2s

# How our own services read a signal, with a secret. TCP only, so the RTP ports stay shut. Basic auth, which
# hands the secret to the callback: it can't check a digest. The port must not be published.
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]
rtspAuthMethods: [basic]

webrtc: no
moq: no

paths:
  '~^live/[0-9a-f-]{36}$':
    # Every input, not only the one on air: analysis needs the wide view whatever viewers are watching.
    record: yes
    # Unix time, so the name means the same in any time zone. The worker places each file by it.
    recordPath: /recordings/%path/%s-%f
    # fMP4 stays readable after a crash, losing at most the last part.
    recordFormat: fmp4
    recordPartDuration: 1s
    # Each file is placed by the clock, so this also limits how long the timeline can drift from it.
    recordSegmentDuration: 60s
    # The default would delete a match's video after a day. The worker removes segments once joined.
    recordDeleteAfter: 0s
